name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'

      - run: flutter pub get

      - name: Accept Android licenses
        run: |
          yes | flutter doctor --android-licenses 2>&1 || true
          flutter doctor -v | grep -E "Android toolchain|licenses" || true

      - name: Build APK
        id: build
        continue-on-error: true
        run: |
          flutter build apk --debug 2>&1 | tee build_output.log
          exit ${PIPESTATUS[0]}

      - name: Find and upload APK
        run: |
          echo "=== Search for APK files ==="
          find /home/runner/work/soul_mate_app -name "*.apk" -type f 2>/dev/null
          APK_COUNT=$(find /home/runner/work/soul_mate_app -name "*.apk" -type f 2>/dev/null | wc -l)
          echo "Found $APK_COUNT APK files"
          if [ $APK_COUNT -gt 0 ]; then
            mkdir -p build/app/outputs/flutter-apk
            find /home/runner/work/soul_mate_app -name "*.apk" -type f 2>/dev/null | while read apk; do
              cp "$apk" build/app/outputs/flutter-apk/
              echo "Copied: $apk"
            done
          fi
          if [ $APK_COUNT -eq 0 ]; then
            echo "=== Build tree ==="
            find /home/runner/work/soul_mate_app/soul_mate_app/build -type d 2>/dev/null | head -50
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_output.log

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/*.apk