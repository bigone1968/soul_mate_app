name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'

      - run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Find APK
        id: find-apk
        run: |
          echo "Searching for APK files..."
          find /home/runner/work/soul_mate_app/soul_mate_app/build -name "*.apk" -type f 2>/dev/null
          APK_PATH=$(find /home/runner/work/soul_mate_app/soul_mate_app/build -name "*.apk" -type f 2>/dev/null | head -1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          if [ -n "$APK_PATH" ]; then
            echo "Found APK: $APK_PATH"
            ls -lh "$APK_PATH"
          else
            echo "ERROR: No APK found!"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ steps.find-apk.outputs.apk_path }}
