name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'

      - run: flutter pub get

      - name: Accept Android licenses
        run: |
          yes | flutter doctor --android-licenses 2>&1 || true
          flutter doctor -v | grep -E "Android toolchain|licenses" || true

      - name: Check environment
        run: |
          flutter doctor -v
          echo "=== Android SDK ==="
          echo $ANDROID_HOME
          ls -la /usr/local/lib/android/sdk/ 2>/dev/null || echo "No SDK dir"
          ls -la /usr/local/lib/android/sdk/platforms/ 2>/dev/null || echo "No platforms"
          echo "=== NDK ==="
          ls /usr/local/lib/android/sdk/ndk/ 2>/dev/null || echo "No NDK"

      - name: Build APK (verbose)
        run: |
          flutter build apk --debug --verbose 2>&1 | tee build_output_full.log
          status=${PIPESTATUS[0]}
          echo "Flutter exit code: $status"
          if [ $status -ne 0 ]; then
            echo "=== Gradle output (last 500 lines) ==="
            grep -n "Gradle" build_output_full.log | tail -50
            echo "=== Error/Warning lines ==="
            grep -iE "(error|failure|failed|exception|BUILD FAILED)" build_output_full.log || echo "No errors found"
            echo "=== APK search ==="
            find /home/runner/work/soul_mate_app -name "*.apk" 2>/dev/null
            echo "=== Full build tree ==="
            find /home/runner/work/soul_mate_app/soul_mate_app/build -type f 2>/dev/null | head -100
            echo "=== Outputs dir ==="
            ls -la /home/runner/work/soul_mate_app/soul_mate_app/build/app/outputs/ 2>/dev/null || echo "No outputs dir"
            ls -la /home/runner/work/soul_mate_app/soul_mate_app/build/app/ 2>/dev/null || echo "No app build dir"
          fi
          echo "=== Full log size ==="
          wc -l build_output_full.log
          tail -500 build_output_full.log
          exit $status

      - name: Diagnose Gradle - run directly if build failed
        if: failure()
        run: |
          cd android
          echo "=== Gradle version ==="
          ./gradlew --version 2>&1 | head -20
          echo "=== Available tasks ==="
          ./gradlew tasks --group=build 2>&1 | head -50
          echo "=== Run assembleDebug directly ==="
          ./gradlew assembleDebug --stacktrace 2>&1 | tail -300
          echo "=== Android outputs ==="
          find build -type f 2>/dev/null | head -100

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-full
          path: build_output_full.log

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/*.apk