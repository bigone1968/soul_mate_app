name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'

      - run: flutter pub get

      - run: |
          flutter build apk --debug 2>&1 | tee build_output.log
          status=${PIPESTATUS[0]}
          echo "Flutter exit code: $status"
          if [ $status -ne 0 ]; then
            echo "=== Last 50 lines ==="
            tail -50 build_output.log
            exit $status
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/*.apk