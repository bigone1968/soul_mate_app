name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'

      - run: flutter pub get

      - name: Check environment
        run: |
          flutter doctor -v
          echo "=== Android SDK ==="
          echo $ANDROID_HOME
          ls -la /usr/local/lib/android/sdk/ 2>/dev/null || echo "No SDK dir"
          ls -la /usr/local/lib/android/sdk/platforms/ 2>/dev/null || echo "No platforms"
          echo "=== NDK ==="
          ls /usr/local/lib/android/sdk/ndk/ 2>/dev/null || echo "No NDK"

      - name: Build APK
        run: |
          flutter build apk --debug 2>&1 | tee build_output.log
          status=${PIPESTATUS[0]}
          echo "Flutter exit code: $status"
          if [ $status -ne 0 ]; then
            echo "=== Last 200 lines ==="
            tail -200 build_output.log
            echo "=== Build directory listing ==="
            find build -name "*.apk" -o -name "*.aab" 2>/dev/null | head -20
            ls -la build/app/outputs/ 2>/dev/null || echo "No outputs dir"
            exit $status
          fi
          echo "Build succeeded!"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_output.log

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/*.apk