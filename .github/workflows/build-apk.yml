name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'

      - run: flutter pub get

      - run: |
          flutter build apk --debug --verbose 2>&1 | tee build_output.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            echo "=== 错误摘要 ==="
            grep -E "FAILED|BUILD FAILED|What went wrong|Caused by|FAILURE:|Error:" build_output.log | tail -30
            exit $status
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/*.apk